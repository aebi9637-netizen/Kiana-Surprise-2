<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>برای کیانا ❤️</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <canvas id="scene"></canvas>


    <div
        class="loading"
        id="loading"
    >
        در حال آماده‌سازی سورپرایز...
    </div>


    <div
        class="cinematic-text"
        id="cinematicText"
    >

        <div id="cinematicLine1">
            کیانا...
        </div>

        <div id="cinematicLine2">
            این بار یه چیزایی رو باید خودت کشف کنی.
        </div>

    </div>


    <!-- =========================
         MOBILE JOYSTICK
    ========================== -->

    <div
        class="joystick-area"
        id="joystickArea"
    >

        <div
            class="joystick"
            id="joystick"
        >

            <div
                class="joystick-knob"
                id="joystickKnob"
            ></div>

        </div>

    </div>


    <script
        type="module"
        src="script.js"
    ></script>

</body>

</html>
